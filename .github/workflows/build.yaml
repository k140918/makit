name: build
on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.16

      - name: Test
        run: go test -covermode=count -coverprofile=coverage.out ./...

      - name: Build
        run: go build -o makit ./cmd/main

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          file: coverage.out
          format: golang
          fail-on-error: false
        continue-on-error: true
        if: "matrix.os == 'ubuntu-latest'"